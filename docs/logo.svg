<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108" role="img" aria-labelledby="title desc">
  <title id="title">Pivot Proxy logo</title>
  <desc id="desc">Two arrows circling a central node: traffic routed (pivoted) through the device.</desc>
  <defs>
    <linearGradient id="backdrop" x1="8" y1="8" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A2980"/>
      <stop offset="0.55" stop-color="#1F6FB2"/>
      <stop offset="1" stop-color="#26D0CE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Backdrop: inset rounded square emulating Android's icon mask -->
  <rect x="8" y="8" width="92" height="92" rx="20" ry="20" fill="url(#backdrop)" filter="url(#shadow)"/>

  <!-- Pivot loop: two arcs forming a circle around the centre -->
  <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
    <path d="M60.2,30.8 A24,24 0 0 1 60.2,77.2"/>
    <path d="M47.8,77.2 A24,24 0 0 1 47.8,30.8"/>
  </g>

  <!-- Arrowheads closing each arc -->
  <g fill="#FFFFFF">
    <path d="M52.5,79.3 L58.9,72.4 L61.5,82.0 Z"/>
    <path d="M55.5,28.7 L49.1,35.6 L46.5,26.0 Z"/>
  </g>

  <!-- Central node (the device / pivot point) -->
  <circle cx="54" cy="54" r="4.5" fill="#FFCA28"/>
</svg>
